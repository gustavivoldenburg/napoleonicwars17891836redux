naplesrework_1789_1815_first_100_focus_18_desc:0 "Since the conquest of Naples by Alfonso V of Aragon on June 2, 1442, the Kingdoms of Naples and Sicily have been bound together under a single monarch. While both kingdoms retained their own administrations, laws, and institutions, this personal union ensured that the political fate of Sicily and Naples became closely intertwined. Over the centuries, this connection persisted through the Aragonese, Spanish Habsburg, and Bourbon dynasties, shaping the political, economic, and cultural development of southern Italy."
